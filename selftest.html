<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>selftest</title>
</head>
<body>
<pre id="report">running…</pre>
<video id="v" src="test_face.mp4" muted playsinline style="display:none"></video>
<canvas id="c" style="display:none"></canvas>
<script src="face-api.min.js"></script>
<script>
const rep = document.getElementById('report');
const out = {};
function log(k, v) { out[k] = v; rep.textContent = JSON.stringify(out, null, 1); }

(async () => {
  try {
    log('t0', 'start');
    // 1) 模型
    await faceapi.nets.tinyFaceDetector.loadFromUri('./models');
    log('model_loaded', true);

    // 2) 视频
    const v = document.getElementById('v');
    await new Promise((res, rej) => {
      if (v.readyState >= 2) return res();
      v.onloadeddata = res; v.onerror = () => rej(new Error('video error'));
      setTimeout(() => rej(new Error('video timeout')), 15000);
    });
    v.currentTime = 1.0;
    await new Promise(res => { v.onseeked = res; setTimeout(res, 5000); });
    log('video_size', v.videoWidth + 'x' + v.videoHeight);

    // 3) 画到 canvas
    const c = document.getElementById('c');
    const ctx = c.getContext('2d', { willReadFrequently: true });
    c.width = v.videoWidth; c.height = v.videoHeight;
    ctx.drawImage(v, 0, 0, c.width, c.height);
    const before = ctx.getImageData(0, 0, c.width, c.height).data.slice();
    log('canvas_drawn', true);

    // 4) 检测
    const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.3 });
    const dets = await faceapi.detectAllFaces(c, opts);
    log('faces_found', dets.length);
    if (dets.length) {
      const b = dets[0].box;
      log('face0_box', { x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.width), h: Math.round(b.height) });
    }

    // 5) 打码
    if (dets.length) {
      const b = dets[0].box;
      const px = 14;
      const cols = Math.max(1, Math.floor(b.width / px));
      const rows = Math.max(1, Math.floor(b.height / px));
      const tmp = document.createElement('canvas');
      tmp.width = cols; tmp.height = rows;
      tmp.getContext('2d').drawImage(c, b.x, b.y, b.width, b.height, 0, 0, cols, rows);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(tmp, 0, 0, cols, rows, b.x, b.y, b.width, b.height);
    }
    const after = ctx.getImageData(0, 0, c.width, c.height).data;
    let changed = 0;
    for (let i = 0; i < after.length; i += 4) {
      if (Math.abs(after[i] - before[i]) > 8) changed++;
    }
    log('pixels_changed', changed);
    log('pixels_changed_pct', +(100 * changed / (after.length / 4)).toFixed(2));

    // 6) MediaRecorder 可用性
    log('mediarecorder', typeof MediaRecorder !== 'undefined');
    log('canvas_captureStream', typeof c.captureStream === 'function');
    log('webm_supported', typeof MediaRecorder !== 'undefined' &&
        (MediaRecorder.isTypeSupported('video/webm;codecs=vp8') || MediaRecorder.isTypeSupported('video/webm')));

    log('RESULT', 'PASS');
  } catch (e) {
    log('RESULT', 'FAIL');
    log('error', String(e && e.message || e));
  }
  document.title = 'DONE-' + out.RESULT;
})();
</script>
</body>
</html>
